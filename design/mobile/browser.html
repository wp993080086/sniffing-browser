<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动端 · 首页（起始页 + 引擎切换）</title>
<link rel="stylesheet" href="base.css">
<style>
/* 页面专属：双行工具栏（结构对照 首页和左上角引擎切换.jpg） */
/* 首页顶部纯白：状态栏与工具栏同为白色，无渐变"肩膀" */
.toolbar { background:var(--white); border-bottom:1px solid var(--border); flex-shrink:0; padding:var(--sp-1) var(--sp-4) var(--sp-2); z-index:3; position:relative; }
.tb-row { display:flex; align-items:center; gap:var(--sp-1); }
.tb-btn {
  width:36px; height:36px; border:none; background:transparent; color:var(--text-2); cursor:pointer;
  border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.tb-btn svg { width:20px; height:20px; }
.tb-btn:active { transform:scale(.88); background:var(--fill-2); }
.tb-btn.hl { color:var(--brand-6); }
.url-pill {
  flex:1; min-width:0; height:40px; border-radius:var(--radius-full); background:var(--fill-2);
  display:flex; align-items:center; gap:8px; padding:0 14px; cursor:text;
  border:1px solid transparent;
  transition:border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.url-pill:focus-within { border-color:var(--brand-4); box-shadow:0 0 0 3px rgba(117,121,255,.14); background:var(--white); }
.url-pill svg { width:16px; height:16px; color:var(--text-3); flex-shrink:0; }
.url-pill input { flex:1; border:none; outline:none; background:transparent; font-family:inherit; font-size:13px; color:var(--text-1); min-width:0; }
.url-pill input::placeholder { color:var(--text-3); }
.tb-dl { display:flex; align-items:center; gap:4px; }
/* 引擎选择 + 下拉 */
.engine-wrap { position:relative; }
.engine-chip {
  height:36px; padding:0 12px; border:1px solid var(--border-strong); border-radius:var(--radius-full);
  background:var(--white); color:var(--text-1); cursor:pointer; font-family:inherit; font-size:12px; font-weight:500;
  display:flex; align-items:center; gap:6px;
  transition:transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.engine-chip svg { width:14px; height:14px; color:var(--brand-6); }
.engine-chip:active { transform:scale(.95); background:var(--brand-1); }
.engine-menu {
  position:absolute; top:40px; left:0; width:150px; background:var(--white);
  border-radius:var(--radius-md); border:1px solid var(--border); box-shadow:var(--shadow-3);
  padding:6px; z-index:9; animation:rise var(--dur-base) var(--ease) backwards;
}
.engine-item {
  display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:var(--radius-sm);
  font-size:13px; cursor:pointer; transition:background var(--dur-fast) var(--ease);
}
.engine-item:active { background:var(--fill-2); }
.engine-item.on { color:var(--brand-6); font-weight:600; background:var(--brand-1); }
.engine-item svg { width:15px; height:15px; margin-left:auto; color:var(--brand-6); }
/* 中央起始页主体 */
.start { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 36px; }
.logo {
  width:72px; height:72px; border-radius:24px; background:var(--gradient-brand);
  box-shadow:var(--shadow-brand), var(--shadow-inset);
  display:flex; align-items:center; justify-content:center; margin-bottom:16px;
}
.logo svg { width:36px; height:36px; color:#fff; }
.start h1 { font-size:22px; font-weight:600; letter-spacing:1px; margin-bottom:24px; }
.start-search {
  width:100%; height:52px; border-radius:var(--radius-full); border:1.5px solid var(--border-strong);
  background:var(--white); display:flex; align-items:center; gap:10px; padding:0 20px; cursor:text;
  transition:border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.start-search:focus-within { border-color:var(--brand-5); box-shadow:0 0 0 4px rgba(117,121,255,.15); }
.start-search svg { width:20px; height:20px; color:var(--text-3); }
.start-search input { flex:1; border:none; outline:none; background:transparent; font-family:inherit; font-size:14px; min-width:0; }
.start-search input::placeholder { color:var(--text-3); }
.quick { display:flex; gap:26px; margin-top:var(--sp-6); }
.q-item {
  display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; border:none; background:transparent; font-family:inherit;
  transition:transform var(--dur-fast) var(--ease);
}
.q-item:active { transform:scale(.9); }
.q-item svg { width:22px; height:22px; color:var(--brand-6); }
.q-item span { font-size:11px; color:var(--text-2); }
.engine-note { margin-top:20px; font-size:11px; color:var(--text-3); }
</style>
</head>

<div class="page-title">移动端设计稿 · <b>首页（起始页）</b> · 布局对照「首页和左上角引擎切换.jpg」</div>

    <div class="frame-label"><span class="dot"></span>起始页 · 引擎下拉展开</div>
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>

          <!-- 引擎切换（下拉展开态） -->
