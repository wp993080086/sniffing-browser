<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动端 · 多页签抽屉</title>
<link rel="stylesheet" href="base.css">
<style>
/* 页面专属：页签抽屉（结构对照 多页签.jpg） */
/* 遮罩下的底衬：纯白即可 */
.web-demo { position:absolute; top:44px; left:0; right:0; bottom:0; background:var(--white); }
/* 状态栏浮于遮罩之上 */
.statusbar { position:relative; z-index:6; }
.drawer-mask { position:absolute; inset:0; background:rgba(23,24,43,.45); z-index:4; }
.drawer {
  position:absolute; left:0; right:0; bottom:0; z-index:5;
  background:var(--fill-1); border-radius:22px 22px 0 0;
  box-shadow:0 -8px 30px rgba(31,35,58,.20);
  height:80%; display:flex; flex-direction:column;
  animation:up var(--dur-slow) var(--ease) backwards;
}
@keyframes up { from { transform:translateY(40px); opacity:.4; } to { transform:translateY(0); opacity:1; } }
.grabber { width:44px; height:4px; border-radius:2px; background:var(--border-strong); margin:10px auto 0; }
.drawer-head { display:flex; align-items:center; padding:14px 16px 12px; }
.drawer-head h2 { font-size:16px; font-weight:600; }
.drawer-head .count { font-size:14px; color:var(--text-3); font-weight:500; margin-left:8px; font-family:var(--font-num); }
.new-btn {
  margin-left:auto; border:none; background:transparent; cursor:pointer; font-family:inherit;
  font-size:13px; font-weight:600; color:var(--brand-6);
  display:flex; align-items:center; gap:5px; padding:6px 10px; border-radius:var(--radius-sm);
  transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.new-btn svg { width:16px; height:16px; }
.new-btn:active { background:var(--brand-1); transform:scale(.95); }
/* 页签卡片网格（高度撑满抽屉剩余空间，可滚动） */
.tab-grid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; padding:0 16px var(--sp-6); align-content:start; }
.tab-card {
  border-radius:var(--radius-lg); border:1.5px solid var(--border); background:var(--white);
  padding:var(--sp-4); cursor:pointer; position:relative; min-height:120px;
  display:flex; flex-direction:column; gap:8px;
  transition:transform var(--dur-fast) var(--ease), border-color var(--dur-base) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.tab-card:active { transform:scale(.97); }
.tab-card.on { border-color:var(--brand-5); background:var(--brand-1); box-shadow:0 0 0 3px rgba(117,121,255,.12); }
.tab-card .kind { font-size:10px; color:var(--text-3); }
.tab-card .name {
  font-size:13px; font-weight:600; color:var(--text-1);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
}
.tab-card .preview {
  margin-top:auto; height:56px; border-radius:var(--radius-sm);
  background:var(--gradient-brand-soft); border:1px solid var(--brand-2);
  display:flex; align-items:center; justify-content:center;
}
.tab-card .preview svg { width:22px; height:22px; color:var(--brand-5); }
.tab-card .close-btn {
  position:absolute; top:2px; right:2px; width:32px; height:32px; border:none; border-radius:50%;
  background:transparent; color:var(--text-3); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.tab-card .close-btn svg { width:18px; height:18px; }
.tab-card .close-btn:active { background:var(--fill-2); transform:scale(.85); }
/* 主页页签：固定不可关闭，图标 + 文案居中 */
.tab-card.fixed { align-items:center; justify-content:center; }
.tab-card.fixed svg { width:26px; height:26px; color:var(--brand-5); }
.tab-card.fixed span { font-size:13px; font-weight:600; color:var(--text-1); }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="i-signal" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="3" height="7" rx="1"/><rect x="8.5" y="11" width="3" height="10" rx="1"/><rect x="14" y="8" width="3" height="13" rx="1"/><rect x="19.5" y="4" width="3" height="17" rx="1" opacity=".4"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5a12.5 12.5 0 0 1 16 0"/><path d="M7 13a8.5 8.5 0 0 1 10 0"/><path d="M10 16.5a4.5 4.5 0 0 1 4 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="8" width="17" height="8" rx="2"/><path d="M22 11v2"/><rect x="4.5" y="10" width="10" height="4" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V9.5"/><path d="M9.5 20.5v-6a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7.5 4v16M16.5 4v16M3 9h4.5M3 15h4.5M16.5 9H21M16.5 15H21"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></symbol>
</defs></svg>

<div class="page-title">移动端设计稿 · <b>多页签抽屉</b> · 布局对照「多页签.jpg」</div>

<div class="frames">
  <div>
    <div class="frame-label"><span class="dot"></span>页签管理 · 主页固定不可关闭</div>
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <div class="sb-icons"><svg><use href="#i-signal"/></svg><svg><use href="#i-wifi"/></svg><svg><use href="#i-battery"/></svg></div>
      </div>
      <!-- 遮罩下的底衬：纯白 -->
      <div class="web-demo"></div>

      <div class="drawer-mask"></div>
      <div class="drawer">
        <div class="grabber"></div>
        <div class="drawer-head">
          <h2>页签</h2><span class="count">3</span>
          <button class="new-btn"><svg><use href="#i-plus"/></svg>新建</button>
        </div>
        <div class="tab-grid">
          <!-- 主页页签：固定不可关闭 -->
          <div class="tab-card on fixed">
            <svg><use href="#i-home"/></svg>
            <span>主页</span>
          </div>
          <!-- 普通网页页签 -->
          <div class="tab-card">
            <span class="kind">m.example.com</span>
            <span class="name">第三集 - 正片</span>
            <div class="preview"><svg><use href="#i-film"/></svg></div>
            <button class="close-btn" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
          </div>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</div>

</body>
</html>
